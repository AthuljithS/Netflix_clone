<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <title>{% block title %}Netflix{% endblock %}</title>
    <style>
    /* global style*/
    *{
        margin:0;
        padding: 0;
        box-sizing: border-box;
    }
    body{
        background-color: #000;
        color: white;
        font-family: 'Inter', sans-serif;
    }
    nav{
        background-color: #000;
        padding: 20px 40px;
    }
    nav h1{
        font-family: 'Bebas Neue', sans-serif;
        text-align: center;
        color: #e50914;
        font-size: 90px;
        letter-spacing: 7px;
        
    }
    
        
    
    

    

    .login{
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: #131313;
        max-width: 200px;
        padding: 30px;
        margin-left: auto;
        margin-right: auto;
        padding-left: 120px;
        padding-right: 120px;
        border-radius: 8px;
        box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.1);
        
        
        
        
    }
    input[type="text"],
    input[type="password"]{
        height: 30px;
        margin-bottom: 10px;
        background-color: rgb(34, 33, 33);
        border: 1px solid #4f5660;
        padding: 12px;
        border-radius: 6px;
        color: rgb(241, 238, 238);
        box-shadow: 0px 5px 15px rgba(0, 0, 0, 0.08);
    }
   
    
    #button{
        margin-left: 60px;
        color: rgb(241, 238, 238);
        background-color: rgb(44, 42, 42);
        border: 1px solid #4f5660;
        padding: 12px;
        border-radius: 6px;
    }
    /* movie cards*/
    .movies-grid{
        display: grid;
        grid-template-columns: repeat(4,1fr);
        gap:15px;
        padding: 30px;
    }
    .card{
        background-color: #222;
        border-radius: 8px;
        overflow: hidden;
        cursor: pointer;
        transition: transform 0.3s;
    }
    .card:hover{
        transform: scale(1.05);
    }

    .card img{
        width: 100%;
        height: 200px;
        object-fit: cover;
    }

    .card-info{
        padding: 10px;
    }
    .card info h3{
        font-size: 15px;
        margin-bottom: 5px;
    }
    .card-info p{
        color: #aaa;
        font-size: 12px;
    }
    .rating{
        color: #f5c518;
    }
    .description{
        font-size: 25px;
        color: #aaa;
        margin-top: 8px;
        display: none;
    }
    .card:hover .description{
        display: block;
    }
    
</style>
{% block extra_css %}{% endblock %}
</head>

<body>
    <nav>
        <h1>NETFLIX</h1>
    </nav>
    {% block content %}
    {% endblock %}
</body>
</html>
